<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surgical Recall Rapid Fire</title>
<style>
:root{
  --paper:#E7EBE0;
  --card:#FCFCF7;
  --ink:#15252F;
  --soft:#69796E;
  --stem:#5C6B60;
  --rule:#CFD7C6;
  --accent:#A33124;
  --accent-soft:#F6E7E2;
  --plum:#1D3A44;
  --tag:#E8EEE4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(rgba(255,255,255,.32) 1px,transparent 1px);
  background-size:100% 30px;
  color:var(--ink);font-family:var(--mono);
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px 32px}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:13px}
.mast h1{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin:0;color:var(--plum)}
.mast .count{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.mast .count b{color:var(--ink);font-weight:600}
.mast .count .dn::before{content:"\00b7";margin:0 6px;color:var(--rule)}

.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
select,.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:999px;
  padding:9px 14px;line-height:1;cursor:pointer;-webkit-appearance:none;appearance:none;
}
select{flex:1 1 100%;min-width:0;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% - 2px),calc(100% - 12px) calc(50% - 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.chip:hover{border-color:#B4C0AC}
.chip.on{background:var(--plum);color:#FFF;border-color:var(--plum)}
.chip.arm{background:var(--accent-soft);color:var(--accent);border-color:#E3C7BF}
#reset{margin-left:auto}
.chip:focus-visible,select:focus-visible,.card:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.track{height:6px;background:#D6DECD;border-radius:999px;margin-bottom:16px;overflow:hidden}
.track i{display:block;height:100%;min-width:6px;border-radius:999px;background:var(--plum);width:0;transition:width .25s cubic-bezier(.3,1.2,.5,1)}

.stack{position:relative}
.stack::before,.stack::after{
  content:"";position:absolute;left:10px;right:10px;top:10px;bottom:2px;
  background:var(--card);border:1px solid var(--rule);border-radius:18px;z-index:0
}
.stack::before{transform:rotate(-1.1deg);transform-origin:50% 100%}
.stack::after{transform:rotate(.9deg);transform-origin:50% 100%}

.card{
  position:relative;z-index:1;background:var(--card);border:1px solid var(--rule);border-radius:18px;
  box-shadow:0 10px 24px -18px rgba(21,37,47,.5);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  min-height:250px;display:flex;flex-direction:column;overflow:hidden;
}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 15px 0}
.ch{
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--plum);
  background:var(--tag);border-radius:999px;padding:5px 10px
}
.seen{
  margin-left:auto;display:none;align-items:center;gap:4px;
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--stem)
}
.card.seen-on .seen{display:inline-flex}
.star{border:0;background:none;padding:3px;margin:-3px;cursor:pointer;line-height:1;color:#C4CDBB}
.star svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}

.body{padding:15px 18px 22px;flex:1;display:flex;flex-direction:column}
.stem{font-size:13px;line-height:1.5;letter-spacing:.01em;color:var(--stem);margin:0 0 11px;max-width:52ch;text-wrap:pretty}
.q{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0}

.tear{margin:20px -18px 0;height:1px;background:repeating-linear-gradient(90deg,var(--rule) 0 5px,transparent 5px 12px)}
.ans{display:none;padding:18px 0 0}
.card.open .ans{display:block}
.stamp{
  display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;
  font-size:9.5px;font-weight:700;letter-spacing:.14em;padding:5px 11px 4px;
  transform:rotate(-2.5deg);margin-bottom:12px
}
.card.open .stamp{animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:rotate(-10deg) scale(.6);opacity:0}to{transform:rotate(-2.5deg) scale(1);opacity:1}}
.a{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0;color:var(--ink)}

.nav{display:flex;gap:7px;margin-top:16px}
.btn{
  flex:1;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  padding:14px 8px;text-align:center;background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;cursor:pointer;
}
.btn.primary{flex:1.5;background:var(--plum);color:#fff;border-color:var(--plum)}
.btn.primary:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.foot{margin:15px 4px 0;font-size:10px;letter-spacing:.03em;color:var(--soft);text-align:center;line-height:1.6}
.foot .touch{display:none}
@media (max-width:560px){.foot .keys{display:none}.foot .touch{display:inline}}
/* Below ~460px the four chips can't share a row — and the armed reset label is
   wider still — so pair them off in a grid instead of letting one chip wrap
   alone. Reset keeps the right-hand slot. */
@media (max-width:460px){
  .bar{display:grid;grid-template-columns:1fr 1fr}
  .bar select{grid-column:1/-1}
  #reset{margin-left:0}
}
.empty{padding:40px 16px;text-align:center;font-size:11px;color:var(--soft)}
@media (max-width:400px){.q,.a{font-size:18px}.stem{font-size:12px}.card{min-height:225px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <h1>Surgical Recall / Rapid Fire</h1>
    <div class="count"><b id="pos">1</b> / <span id="total">330</span><span class="dn" id="donen"></span></div>
  </div>

  <div class="bar">
    <select id="chapter" aria-label="Chapter"></select>
    <button class="chip" id="shuffle" type="button">Shuffle</button>
    <button class="chip" id="order" type="button">Book order</button>
    <button class="chip" id="starred" type="button" aria-pressed="false">Starred only</button>
    <button class="chip" id="reset" type="button">Reset</button>
  </div>

  <div class="track"><i id="fill"></i></div>

  <div id="deck">
    <div class="stack">
      <div class="card" id="card" tabindex="0" role="button" aria-expanded="false">
        <div class="head">
          <span class="ch" id="ch"></span>
          <span class="seen">&#10003; Done</span>
          <button class="star" id="star" type="button" aria-label="Star this card" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>
          </button>
        </div>
        <div class="body">
          <p class="stem" id="stem"></p>
          <p class="q" id="q"></p>
          <div class="tear"></div>
          <div class="ans">
            <div class="stamp">Answer</div>
            <p class="a" id="a"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="nav">
      <button class="btn" id="prev" type="button">Back</button>
      <button class="btn primary" id="reveal" type="button">Show answer</button>
      <button class="btn" id="next" type="button">Next</button>
    </div>
  </div>

  <div class="empty" id="empty" hidden>Nothing matches. Clear the filters.</div>
  <p class="foot"><span class="touch">Tap to flip, swipe to move on</span><span class="keys">Space flips, space again moves on &nbsp;/&nbsp; arrows change card &nbsp;/&nbsp; S stars</span></p>
</div>

":"Volkmann’s contracture"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"What is the correct diagnosis?","q":"55-year-old male develops acute severe calf pain during an aerobics class; x-rays negative for fracture; on exam, there is no plantar flexion with squeeze of gastrocnemius muscle","a":"Achilles’ tendon rupture"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"What is the correct diagnosis?","q":"28-year-old man with traumatic superficial arterial occlusion for 7 hours develops severe calf pain with passive dorsiflexion of foot, foot paresthesias, decreased foot/toe movement, and palpable pulse after successful bypass procedure","a":"Calf compartment syndrome"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"Name the most likely diagnosis:","q":"30-year-old woman with thoracic back pain, destruction of thoracic vertebral bodies on x-ray, + PPD","a":"Pott’s disease (tuberculosis of the spine)"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"Name the most likely diagnosis:","q":"16-year-old boy with right knee pain and fevers; x-ray reveals a distal femur lesion with “sunburst” pattern with a triangle of elevated periosteum","a":"Osteosarcoma"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"Name the most likely diagnosis:","q":"Femur fracture, dyspnea, mental status changes, tachycardia, petechiae","a":"Fat embolism syndrome"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"Name the most likely diagnosis:","q":"Elderly man with shortened and inverted LE","a":"Hip dislocation"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"Name the most likely diagnosis:","q":"35-year-old female trips and lands on her right hand; x-rays are negative for fracture; severe pain on palpating over the anatomical “snuff box”","a":"Scaphoid fracture"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"What is the treatment?","q":"18-year-old male s/p motorbike jump crash with closed rib fib fracture; good distal pulses but severe pain on passive foot extension","a":"Fasciotomy for compartment syndrome"},{"c":73,"t":"ORTHOPEDIC SURGERY","p":"What is the treatment?","q":"45-year-old male s/p fall with severe pain with breathing due to multiple rib fractures","a":"Epidural catheter for pain control"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"What is the GCS for an 18-year-old woman s/p MVC in a “coma”?","a":"= 8"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"What is the GCS for a 40-year-old man brought in dead after an MVC by the rescue paramedics?","a":"3: eyes = 1, motor = 1, verbal = 1"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"What is the GCS for 20-year-old woman s/p motorcycle collision with open eyes, grunting only, and withdrawals to pain?","a":"10 = eyes: 4, motor = 4, verbal = 2"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"What is the GCS for a 29-year-old woman s/p skiing accident into a tree who is intubated; eyes closed even to pain, decorticate posturing only?","a":"5T: eyes = 1, intubated = IT, motor = 3"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"28-year-old man involved in high-speed MVC with lower back spine fracture, bladder/bowel incontinence, decreased lower extremity sensation, and decreased lower extremity strength","a":"Cauda equina syndrome"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"24-year-old woman with spine fracture; paraplegia but with touch and proprioception intact","a":"Anterior spinal cord syndrome"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"29-year-old man s/p 45-foot fall with left-sided loss of temperature and pain sensation; right-sided paresis and loss of right-sided proprioception","a":"Brown-Séquard syndrome"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"18-year-old woman with a cervical spinal fracture after diving into a shallow pool; intact perianal sensation and decreased lower extremity sensation and movement","a":"Central cord syndrome"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"50-year-old woman with painless proptosis and a brain tumor stuck to the dura","a":"Meningioma"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"19-year-old woman involved in a high-speed MVC and was thrown unrestrained into the windshield; she has a GCS of 15 at the scene and initially upon admission to the ER; she then becomes comatose with a GCS of 3","a":"Epidural hematoma and “lucid interval”"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"Patient with head trauma and a peripheral “crescent”-shaped hematoma on CT scan","a":"Subdural hematoma"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"Patient with head trauma and a peripheral “lenticular” (lens-like) hematoma on CT scan","a":"Epidural hematoma"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"Hypoxia after brain injury without lung injury, no fractures, no DVTs","a":"Neurogenic pulmonary edema"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"Coagulopathy after isolated brain injury","a":"Brain thromboplastin"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"40-year-old s/p fall from a balcony, GCS of 3, heart rate 40, SBP of 190/90, blown right pupil","a":"Elevated ICP with brain herniation"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"22-year-old female s/p MVC, GCS of 3, nl brain CT scan, nl brain MRI, nl EEG","a":"Cervical vascular injury (e.g., carotid artery dissection with thrombosis)"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"21-year-old male s/p MVC with hypotension, bradycardia, nl CXR, nl FAST exam, nl pelvic x-ray","a":"Spinal cord injury with neurologic shock"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"39-year-old woman lifting weights has onset of lower back pain, cannot urinate, and is passing flatus that she cannot control; on exam, the bladder is distended, poor rectal tone, and perineal skin numbness (anesthesia)","a":"Cauda equina syndrome"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"29-year-old diabetic with chronic bacterial sinusitis, new-onset seizures, fever, and right-sided weakness","a":"Brain abscess"},{"c":74,"t":"NEUROSURGERY","p":"Name the most likely diagnosis:","q":"40-year-old male with chronic low back pain lifts a refrigerator and experiences severe pain shooting down his right leg out his right big toe","a":"Herniated disc at L4-L5"},{"c":74,"t":"NEUROSURGERY","p":"Name the diagnostic modality:","q":"18-year-old female with fall from horse with loss of consciousness","a":"Brain CT scan without contrast"},{"c":74,"t":"NEUROSURGERY","p":"Name the diagnostic modality:","q":"39-year-old female librarian with acute loss of hearing in her left ear","a":"MRI to rule out acoustic nerve neuroma"},{"c":74,"t":"NEUROSURGERY","p":"What is the treatment?","q":"28-year-old male s/p motorcycle collision, presents with eyes closed, not making any verbal sounds, decorticate posturing to painful stimuli","a":"GCS of 5 and in a “coma”; must be intubated"},{"c":74,"t":"NEUROSURGERY","p":"What is the treatment?","q":"34-year-old female with small prolactinoma","a":"Bromocriptine (transsphenoidal resection if refractory)"},{"c":74,"t":"NEUROSURGERY","p":"Name the radiographic test for localizing the following:","q":"Pituitary adenoma?","a":"Gadolinium-enhanced MRI"},{"c":75,"t":"UROLOGY","p":"What is the correct diagnosis?","q":"Abdominal pain, flank mass, hematuria","a":"Renal cell carcinoma"},{"c":75,"t":"UROLOGY","p":"What is the correct diagnosis?","q":"Acute varicocele and hematuria","a":"Left renal tumor"},{"c":75,"t":"UROLOGY","p":"What is the correct diagnosis?","q":"56-year-old male presents with right sided flank pain; cannot sit still, blood in his urine, and fever; x-ray nl; no mass palpated on exam","a":"Nephrolithiasis due to uric acid stone with obstructive urinary infection"},{"c":75,"t":"UROLOGY","p":"What is the correct diagnosis?","q":"60-year-old White male smoker who works at a refinery develops hematuria; no pain or other symptoms","a":"Bladder cancer (“painless hematuria”)"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"70-year-old male retired leather worker, cigarette smoker; presents with painless gross hematuria","a":"Bladder transitional cell carcinoma"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"22-year-old male who develops a right scrotal hydrocele with elevated serum β-HCG","a":"Testicular cancer"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"55-year-old woman with diabetes, recurrent pyelonephritis, increased creatinine, increased BUN; IVP reveals radiolucent defects in the kidney collecting system","a":"Papillary necrosis"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"31-year-old man with right flank pain radiating into scrotum, gross hematuria, right-sided hydronephrosis, and normal abdominal x-ray","a":"Uric acid kidney stone"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"18-year-old women with fever; costovertebral tenderness; flank mass; and WBCs, RBCs, and gram-negative rods in the urine","a":"Kidney (renal) abscess"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"65-year-old man with groin pain who goes into septic shock after a rectal prostatic exam","a":"Bacterial prostatitis"},{"c":75,"t":"UROLOGY","p":"Name the most likely diagnosis:","q":"19-year-old man status post (s/p) spinal anesthetic for a groin hernia repair returns to clinic with back pain, fever, and decreased left lower extremity sensation and movement","a":"Epidural abscess"},{"c":75,"t":"UROLOGY","p":"Name the diagnostic modality:","q":"80-year-old male with history of intermittent hematuria; CT scan is normal","a":"Cystoscopy to rule out bladder cancer"},{"c":75,"t":"UROLOGY","p":"Name the diagnostic modality:","q":"27-year-old male s/p MVC with pelvic fracture and blood at the urethral meatus","a":"Retrograde urethrogram (RUG) to rule out urethral injury"},{"c":75,"t":"UROLOGY","p":"Name the diagnostic modality:","q":"30-year-old female with a pelvic fracture and free fluid in the pelvis","a":"CT scan with CT cystogram to rule out bladder injury"}]</script>
<script>
(function(){
  var ALL = JSON.parse(document.getElementById('cards').textContent);
  var FIX = {Gi:'GI', Icu:'ICU', Ent:'ENT'};
  function nice(t){
    return t.toLowerCase().replace(/\b[a-z]/g, function(m){ return m.toUpperCase(); })
            .replace(/'S\b/g, "'s")
            .split(' ').map(function(w){ return FIX[w] || w; }).join(' ');
  }
  ALL.forEach(function(c){ c.t = nice(c.t); c.k = c.c + '|' + c.p + '|' + c.q; });

  var STORE = 'surgicalrecall.starred';
  function loadStars(){
    var out = {};
    try {
      var saved = JSON.parse(localStorage.getItem(STORE));
      if (saved instanceof Array) saved.forEach(function(k){ out[k] = true; });
    } catch (e){}
    return out;
  }
  function saveStars(){
    try {
      localStorage.setItem(STORE, JSON.stringify(Object.keys(star).filter(function(k){ return star[k]; })));
    } catch (e){}
  }

  var PROG = 'surgicalrecall.progress';
  var deck = [], pos = 0, star = loadStars(), shuffled = false, starOnly = false, chap = 'all';
  var done = {}, atKey = null, seed = 1;

  // Seeded shuffle: storing the seed rather than the shuffled order means a
  // reload rebuilds the exact same sequence, so you resume where you left off.
  function rng(s){
    return function(){
      s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function loadProgress(){
    try {
      var s = JSON.parse(localStorage.getItem(PROG));
      if (!s || typeof s !== 'object') return;
      if (s.done instanceof Array) s.done.forEach(function(k){ done[k] = true; });
      if (typeof s.at === 'string') atKey = s.at;
      if (typeof s.seed === 'number') seed = s.seed;
      if (typeof s.chap === 'string') chap = s.chap;
      shuffled = !!s.shuffled;
      starOnly = !!s.starOnly;
    } catch (e){}
  }
  function saveProgress(){
    try {
      localStorage.setItem(PROG, JSON.stringify({
        done: Object.keys(done).filter(function(k){ return done[k]; }),
        at: deck.length ? deck[pos].k : null,
        chap: chap, shuffled: shuffled, starOnly: starOnly, seed: seed
      }));
    } catch (e){}
  }
  loadProgress();
  var $ = function(id){ return document.getElementById(id); };
  var card = $('card');

  var seen = {}, counts = {}, opts = ['<option value="all">All chapters (' + ALL.length + ' cards)</option>'];
  ALL.forEach(function(c){ counts[c.c] = (counts[c.c] || 0) + 1; });
  ALL.forEach(function(c){
    if (seen[c.c]) return;
    seen[c.c] = true;
    opts.push('<option value="' + c.c + '">Ch ' + c.c + ' \u00b7 ' + c.t + ' (' + counts[c.c] + ')</option>');
  });
  $('chapter').innerHTML = opts.join('');

  function build(restore){
    deck = ALL.filter(function(c){
      if (chap !== 'all' && String(c.c) !== chap) return false;
      if (starOnly && !star[c.k]) return false;
      return true;
    });
    if (shuffled){
      var rnd = rng(seed);
      for (var i = deck.length - 1; i > 0; i--){
        var j = Math.floor(rnd() * (i + 1)), t = deck[i];
        deck[i] = deck[j]; deck[j] = t;
      }
    }
    pos = 0;
    if (restore && atKey){
      for (var k = 0; k < deck.length; k++){
        if (deck[k].k === atKey){ pos = k; break; }
      }
    }
    render();
    saveProgress();
  }

  function render(){
    var has = deck.length > 0;
    $('deck').hidden = !has;
    $('empty').hidden = has;
    $('total').textContent = deck.length;
    $('pos').textContent = has ? pos + 1 : 0;
    var n = 0;
    deck.forEach(function(c){ if (done[c.k]) n++; });
    $('donen').textContent = n + ' done';
    $('fill').style.width = has ? ((pos + 1) / deck.length * 100) + '%' : '0';
    if (!has) return;
    var c = deck[pos];
    $('ch').textContent = 'Ch ' + c.c + ' \u00b7 ' + c.t;
    $('stem').textContent = c.p;
    $('stem').style.display = c.p ? 'block' : 'none';
    $('q').textContent = c.q;
    $('a').textContent = c.a;
    close();
    card.classList.toggle('seen-on', !!done[c.k]);
    $('star').classList.toggle('on', !!star[c.k]);
    $('star').setAttribute('aria-pressed', star[c.k] ? 'true' : 'false');
    $('prev').disabled = pos === 0;
    $('next').disabled = pos === deck.length - 1;
  }

  function open(){
    card.classList.add('open'); card.setAttribute('aria-expanded','true'); $('reveal').textContent = 'Hide answer';
    if (!deck.length) return;
    var c = deck[pos];
    if (!done[c.k]){
      done[c.k] = true;
      card.classList.add('seen-on');
      var n = 0;
      deck.forEach(function(d){ if (done[d.k]) n++; });
      $('donen').textContent = n + ' done';
    }
    saveProgress();
  }
  function close(){ card.classList.remove('open'); card.setAttribute('aria-expanded','false'); $('reveal').textContent = 'Show answer'; }
  function toggle(){ card.classList.contains('open') ? close() : open(); }
  function go(d){
    var n = pos + d;
    if (n < 0 || n >= deck.length) return;
    pos = n; render(); saveProgress();
  }

  card.addEventListener('click', function(e){ if (e.target.closest('.star')) return; toggle(); });
  function advance(){
    if (!card.classList.contains('open')){ open(); return; }
    if (pos < deck.length - 1){ go(1); } else { close(); }
  }

  $('reveal').addEventListener('click', toggle);
  $('prev').addEventListener('click', function(){ go(-1); });
  $('next').addEventListener('click', function(){ go(1); });
  function toggleStar(){
    if (!deck.length) return;
    var c = deck[pos];
    star[c.k] = !star[c.k];
    saveStars();
    $('star').classList.toggle('on', star[c.k]);
    $('star').setAttribute('aria-pressed', star[c.k] ? 'true' : 'false');
    if (starOnly && !star[c.k]) build();
  }
  $('star').addEventListener('click', toggleStar);
  $('chapter').addEventListener('change', function(){ chap = this.value; build(); });
  $('shuffle').addEventListener('click', function(){
    shuffled = true;
    seed = (Math.random() * 4294967296) | 0;
    $('order').classList.remove('on'); this.classList.add('on'); build();
  });
  $('order').addEventListener('click', function(){
    shuffled = false; $('shuffle').classList.remove('on'); this.classList.add('on'); build();
  });
  $('starred').addEventListener('click', function(){
    starOnly = !starOnly;
    this.classList.toggle('on', starOnly);
    this.setAttribute('aria-pressed', starOnly ? 'true' : 'false');
    build();
  });

  function onKey(e){
    if (e.target.tagName === 'SELECT') return;
    var k = e.key;
    if (k === 'ArrowRight'){ e.preventDefault(); go(1); }
    else if (k === 'ArrowLeft'){ e.preventDefault(); go(-1); }
    else if (k === 'ArrowDown'){ e.preventDefault(); open(); }
    else if (k === 'ArrowUp'){ e.preventDefault(); close(); }
    else if (k === ' ' || k === 'Spacebar' || k === 'Enter'){ e.preventDefault(); advance(); }
    else if (k === 's' || k === 'S'){ e.preventDefault(); toggleStar(); }
    else return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON'){
      document.activeElement.blur();
    }
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('keydown', function(e){ if (e.key === ' ') e.preventDefault(); }, {passive:false});

  var x0 = null, y0 = null;
  card.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  card.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6){ go(dx < 0 ? 1 : -1); }
    x0 = null;
  }, {passive:true});

  var armed = null;
  function disarm(){
    clearTimeout(armed); armed = null;
    $('reset').classList.remove('arm');
    $('reset').textContent = 'Reset';
  }
  $('reset').addEventListener('click', function(){
    if (!armed){
      this.classList.add('arm');
      this.textContent = 'Clear done?';
      armed = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    done = {}; atKey = null;
    build();
  });

  $('chapter').value = chap;
  if (!$('chapter').value) { chap = 'all'; $('chapter').value = 'all'; }
  $(shuffled ? 'shuffle' : 'order').classList.add('on');
  $('starred').classList.toggle('on', starOnly);
  $('starred').setAttribute('aria-pressed', starOnly ? 'true' : 'false');
  build(true);
})();
</script>
</body>
